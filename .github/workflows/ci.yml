name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Batalkan run lama kalau ada push baru di branch yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test + coverage
        run: bun run test:coverage

      # SENGAJA tanpa .env: build harus tetap lulus walau konfigurasi kosong.
      # Kalau ini gagal, berarti ada modul yang melempar error saat import
      # (bug yang ditemukan di M0). Jangan tambahkan secrets ke step ini.
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
